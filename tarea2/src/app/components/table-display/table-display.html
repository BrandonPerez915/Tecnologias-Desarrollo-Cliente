<div class="w-full h-full flex flex-col">
  <h1 class="text-3xl font-bold text-center bg-blue-950 text-amber-50 p-5">Input - Output</h1>

  <div class="flex justify-center text-blue-950 p-5 w-full h-full">
    <app-users-table
      class="w-full p-5"
      (userSelected)="selectedUser.set($event)"
    ></app-users-table>
    <app-user-info
      class="w-full p-5"
      [user]="selectedUser()"
      (clearUser)="selectedUser.set(null)"
    ></app-user-info>
  </div>
</div>
