<app-sheet
  title="Crear nueva orden"
  subtitle="Define cómo identificar y gestionar esta venta."
  (close)="close.emit()"
>
  <form [formGroup]="orderForm" (ngSubmit)="submitForm()">
    <label class="new-order-name-field">
      <span>
        Nombre de la orden <small>Opcional</small>
      </span>
      <input
        formControlName="name"
        placeholder="#1043"
      />
      <small>
        Si no escribes un nombre, se utilizará automáticamente un folio consecutivo.
      </small>
    </label>
    <div class="new-order-type">
      <span class="form-label">Tipo de cliente</span>
      <div>
        <button
          type="button"
          [class.active]="orderForm.controls.type.value === 'Minorista'"
          (click)="selectType('Minorista')"
        >
          <span class="order-type-icon">
            <app-icon name="user"></app-icon>
          </span>
          <span>
            <strong>Minorista</strong>
            <small>Venta directa a cliente final</small>
          </span>
          @if (orderForm.controls.type.value === 'Minorista') {
            <i>
              <app-icon name="check" [size]="12"></app-icon>
            </i>
          }
        </button>
        <button
          type="button"
          [class.active]="orderForm.controls.type.value === 'Mayorista'"
          (click)="selectType('Mayorista')"
        >
          <span class="order-type-icon">
            <app-icon name="box"></app-icon>
          </span>
          <span>
            <strong>Mayorista</strong>
            <small>Compra por volumen o distribuidor</small>
          </span>
          @if (orderForm.controls.type.value === 'Mayorista') {
            <i>
              <app-icon name="check" [size]="12"></app-icon>
            </i>
          }
        </button>
      </div>
    </div>
    <div class="new-order-note">
      <app-icon name="receipt" [size]="18"></app-icon>
      <span>
        La nueva orden se creará vacía y podrás añadir productos desde su
        encabezado.
      </span>
    </div>
    <app-button
      type="submit"
      icon="plus"
      className="full-button"
      [disabled]="orderForm.invalid"
    >
      Crear orden
    </app-button>
  </form>
</app-sheet>
