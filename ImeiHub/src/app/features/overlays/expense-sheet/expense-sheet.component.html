<app-sheet
  title="Registrar un gasto"
  subtitle="Anota el dinero que sale de caja."
  (close)="close.emit()"
>
  <form [formGroup]="expenseForm" (ngSubmit)="submitForm($event)" novalidate>
    <div class="form-section">
      <span class="form-label">Elige una categoría</span>
      <div class="category-grid">
        <button
          type="button"
          [class.selected]="expenseForm.controls.category.value === 'merchandise'"
          (click)="setCategory('merchandise')"
        >
          <app-icon name="box"></app-icon>
          <span>
            Compra de<br />mercancía
          </span>
        </button>
        <button
          type="button"
          [class.selected]="expenseForm.controls.category.value === 'food'"
          (click)="setCategory('food')"
        >
          <app-icon name="cash"></app-icon>
          <span>
            Comida /<br />aperitivos
          </span>
        </button>
        <button
          type="button"
          [class.selected]="expenseForm.controls.category.value === 'transport'"
          (click)="setCategory('transport')"
        >
          <app-icon name="swap"></app-icon>
          <span>Transporte</span>
        </button>
        <button
          type="button"
          [class.selected]="expenseForm.controls.category.value === 'other'"
          (click)="setCategory('other')"
        >
          <app-icon name="more"></app-icon>
          <span>Otros</span>
        </button>
      </div>
    </div>

    <app-field
      label="Importe"
      placeholder="0.00"
      type="number"
      inputMode="decimal"
      [required]="true"
      [value]="expenseForm.controls.amount.value"
      [error]="amountError"
      (valueChange)="expenseForm.controls.amount.setValue($event)"
      (blur)="expenseForm.controls.amount.markAsTouched()"
    >
      <span class="field-suffix">MXN</span>
    </app-field>

    <app-field
      label="Nota o justificación"
      placeholder="¿Para qué fue este gasto?"
      [required]="true"
      [value]="expenseForm.controls.note.value"
      [error]="noteError"
      (valueChange)="expenseForm.controls.note.setValue($event)"
      (blur)="expenseForm.controls.note.markAsTouched()"
    ></app-field>

    <div class="form-total">
      <span>Efectivo en caja después del gasto</span>
      <strong>MXN {{ projectedCash() | number:'1.2-2' }}</strong>
    </div>

    <app-button
      type="submit"
      className="full-button"
      [disabled]="submitting() || expenseForm.invalid || (amountError.length > 0)"
    >
      @if (submitting()) {
        Guardando...
      } @else {
        Guardar gasto
      }
    </app-button>
  </form>
</app-sheet>
