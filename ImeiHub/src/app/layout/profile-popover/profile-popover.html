<div class="user">
  <span class="avatar">{{ initials() }}</span>
  <span>
    <strong>{{ user()?.name }}</strong>
    <small>{{ user()?.role }} · Puesto {{ user()?.stallNumber }}</small>
  </span>
</div>

<div class="actions">
  <button type="button" (click)="info('Configuración de perfil abierta')">
    <app-icon name="user" [size]="17" />
    <span>
      <strong>Mi perfil</strong>
      <small>Datos personales y acceso</small>
    </span>
  </button>
  <button type="button" (click)="info('Configuración abierta')">
    <app-icon name="settings" [size]="17" />
    <span>
      <strong>Configuración</strong>
      <small>Tienda, caja y preferencias</small>
    </span>
  </button>
  <button type="button" class="logout" (click)="logout()">
    <app-icon name="logout" [size]="17" />
    <span>
      <strong>Cerrar sesión</strong>
      <small>Salir del sistema ImeiHub</small>
    </span>
  </button>
</div>
