<aside class="sidebar" [class.open]="open()">
  <div class="brand">
    <a routerLink="/dashboard" (click)="closed.emit()">
      <app-brand-logo size="sm" theme="dark" badge="POS" />
    </a>
    <button type="button" class="close" aria-label="Cerrar navegación" (click)="closed.emit()">
      <app-icon name="close" [size]="18" />
    </button>
  </div>

  <nav aria-label="Navegación principal">
    <span class="nav-label">Espacio de trabajo</span>
    @for (item of items; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" (click)="closed.emit()">
        <app-icon [name]="item.icon" />
        <span>{{ item.label }}</span>
        @if (item.badge) {
          <b>{{ item.badge }}</b>
        }
      </a>
    }
  </nav>

  <div class="footer">
    <button type="button" class="logout" (click)="logout()">
      <app-icon name="logout" [size]="17" />
      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>

@if (open()) {
  <button
    type="button"
    class="backdrop"
    aria-label="Cerrar navegación"
    (click)="closed.emit()"
  ></button>
}
