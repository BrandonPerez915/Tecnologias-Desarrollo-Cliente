<header>
  <button
    app-icon-button
    class="menu"
    icon="menu"
    label="Abrir navegación"
    variant="bare"
    (click)="menuClicked.emit()"
  ></button>
  <strong class="mobile-title">{{ title() }}</strong>
  <div class="date">
    <app-icon name="calendar" [size]="17" />
    <span>{{ today }}</span>
  </div>
  <div class="actions">
    <button app-icon-button icon="bell" label="Notificaciones" variant="bare"></button>
    <div class="profile" (mouseenter)="openProfile()" (mouseleave)="scheduleClose()">
      <button
        type="button"
        class="avatar"
        aria-label="Abrir menú de perfil"
        [attr.aria-expanded]="profileOpen()"
        (click)="toggleProfile()"
      >
        {{ initials() }}
      </button>
      @if (profileOpen()) {
        <app-profile-popover />
      }
    </div>
  </div>
</header>
