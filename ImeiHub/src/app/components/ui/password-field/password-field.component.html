<div class="password-field">
  <div class="password-label-row">
    <label [attr.for]="id()" class="password-label-text">
      {{ label() }}
      @if (required()) {
        <span class="required-star">*</span>
      }
    </label>
    <ng-content select="[label-extra]"></ng-content>
  </div>

  <div
    class="password-control"
    [class.error]="!!error()"
    [class.disabled]="disabled()"
  >
    <app-icon name="lock" [size]="17" className="password-leading-icon"></app-icon>

    <input
      [id]="id()"
      [type]="showPassword() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete() || 'current-password'"
      [disabled]="disabled()"
      [ngModel]="value()"
      (ngModelChange)="onValueChange($event)"
      (blur)="blur.emit()"
    />

    <button
      type="button"
      class="password-toggle-btn"
      [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
      (click)="toggleShowPassword()"
      tabindex="-1"
    >
      <app-icon
        [name]="showPassword() ? 'eye-off' : 'eye'"
        [size]="17"
      ></app-icon>
    </button>
  </div>

  @if (error()) {
    <small class="password-error">{{ error() }}</small>
  } @else if (hint()) {
    <small class="password-hint">{{ hint() }}</small>
  }
</div>
