<label class="field">
  <span class="label">
    {{ label() }}
    @if (required()) {
      <span class="required">*</span>
    }
  </span>
  <span class="control" [class.invalid]="!!error()" [class.disabled]="disabled()">
    @if (icon(); as name) {
      <app-icon [name]="name" [size]="17" />
    }
    <input
      [type]="type()"
      [value]="value()"
      [placeholder]="placeholder()"
      [attr.inputmode]="inputMode()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="!!error()"
      [required]="required()"
      [disabled]="disabled()"
      (input)="onInput($event)"
      (blur)="blurred.emit()"
    />
    <ng-content />
  </span>
  @if (error()) {
    <small class="error">{{ error() }}</small>
  } @else if (hint()) {
    <small class="hint">{{ hint() }}</small>
  }
</label>
