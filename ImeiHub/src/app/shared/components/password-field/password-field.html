<div class="label-row">
  <label class="label" [for]="inputId">
    {{ label() }}
    @if (required()) {
      <span class="required">*</span>
    }
  </label>
  <ng-content select="[labelExtra]" />
</div>

<div class="control" [class.invalid]="!!error()" [class.disabled]="disabled()">
  <app-icon name="lock" [size]="17" />
  <input
    [id]="inputId"
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    [placeholder]="placeholder()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-invalid]="!!error()"
    [required]="required()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="blurred.emit()"
  />
  <button
    type="button"
    class="toggle"
    tabindex="-1"
    [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Ver contraseña'"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    <app-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="17" />
  </button>
</div>

@if (error()) {
  <small class="error">{{ error() }}</small>
} @else if (hint()) {
  <small class="hint">{{ hint() }}</small>
}
