<svg
  aria-hidden="true"
  viewBox="0 0 24 24"
  [attr.width]="size()"
  [attr.height]="size()"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  @switch (name()) {
    @case ('home') {
      <svg:path d="m3 10 9-7 9 7" />
      <svg:path d="M5 9v11h14V9M9 20v-7h6v7" />
    }
    @case ('cash') {
      <svg:rect x="3" y="5" width="18" height="14" rx="2" />
      <svg:circle cx="12" cy="12" r="3" />
      <svg:path d="M7 9H5v2M17 15h2v-2" />
    }
    @case ('box') {
      <svg:path d="m4 7 8-4 8 4-8 4-8-4Z" />
      <svg:path d="M4 7v10l8 4 8-4V7M12 11v10" />
    }
    @case ('swap') {
      <svg:path d="M5 7h13l-3-3M19 17H6l3 3" />
      <svg:path d="m18 7-3 3M6 17l3-3" />
    }
    @case ('scan') {

      />

      <svg:path d="M12 5v14M5 12h14" />
    }
    @case ('arrow-up') {
      <svg:path d="m7 11 5-5 5 5M12 6v12" />
    }
    @case ('arrow-down') {
      <svg:path d="m7 13 5 5 5-5M12 18V6" />
    }
    @case ('clock') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="M12 7v5l3 2" />
    }
    @case ('warning') {
      <svg:path
        d="M10.3 4.2 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z"
      />
      <svg:path d="M12 9v4M12 17h.01" />
    }
    @case ('search') {
      <svg:circle cx="11" cy="11" r="7" />
      <svg:path d="m20 20-4-4" />
    }
    @case ('bell') {
      <svg:path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7M10 20h4" />
    }
    @case ('chevron') {
      <svg:path d="m9 18 6-6-6-6" />
    }
    @case ('printer') {
      <svg:path
        d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
      />
      <svg:rect x="6" y="14" width="12" height="7" />
    }
    @case ('bluetooth') {
      <svg:path d="m7 7 10 10-5 4V3l5 4L7 17" />
    }
    @case ('close') {
      <svg:path d="M6 6l12 12M18 6 6 18" />
    }
    @case ('flash') {
      <svg:path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" />
    }
    @case ('image') {
      <svg:rect x="3" y="4" width="18" height="16" rx="2" />
      <svg:circle cx="9" cy="10" r="2" />
      <svg:path d="m21 15-5-5L5 20" />
    }
    @case ('user') {
      <svg:circle cx="12" cy="8" r="4" />
      <svg:path d="M4 21a8 8 0 0 1 16 0" />
    }
    @case ('check') {
      <svg:path d="m5 12 4 4L19 6" />
    }
    @case ('calendar') {
      <svg:rect x="3" y="5" width="18" height="16" rx="2" />
      <svg:path d="M16 3v4M8 3v4M3 10h18" />
    }
    @case ('tag') {
      <svg:path d="M20 13 13 20 4 11V4h7l9 9Z" />
      <svg:circle cx="8.5" cy="8.5" r="1.5" />
    }
    @case ('return') {
      <svg:path d="m9 14-5-5 5-5" />
      <svg:path d="M4 9h10a6 6 0 0 1 6 6v3" />
    }
    @case ('menu') {
      <svg:path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('filter') {
      <svg:path d="M4 6h16M7 12h10M10 18h4" />
    }
    @case ('receipt') {
      <svg:path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z" />
      <svg:path d="M9 8h6M9 12h6M9 16h3" />
    }
    @case ('settings') {
      <svg:circle cx="12" cy="12" r="3" />
      <svg:path
        d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"
      />

    @case ('logout') {
      <svg:path d="M10 17l5-5-5-5M15 12H3" />
      <svg:path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5" />
    }
  }
</svg>
