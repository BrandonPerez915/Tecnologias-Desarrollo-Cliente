<section class="empty-state-container">
  <div class="icon-bubble">
    <span class="material-symbols-outlined">{{ icon }}</span>
  </div>
  <h4 class="empty-title">{{ title }}</h4>
  <p class="empty-desc">{{ description }}</p>
  @if (actionLabel) {
    <button
      type="button"
      class="empty-action-btn"
      (click)="onActionClick()">
      {{ actionLabel }}
    </button>
  }
</section>
